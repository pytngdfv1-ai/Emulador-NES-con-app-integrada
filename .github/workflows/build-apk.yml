name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android si no existe
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Generar iconos y splash
        run: npx @capacitor/assets generate --android

      - name: Preparar ROM (renombrar a game.nes)
        run: |
          mkdir -p www/rom
          cd www/rom
          f=$(find . -maxdepth 1 -iname '*.nes' ! -name 'game.nes' | head -n 1)
          if [ -z "$f" ] && [ ! -f game.nes ]; then
            z=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
            if [ -n "$z" ]; then
              unzip -o "$z" -d tmp_rom
              f=$(find tmp_rom -iname '*.nes' | head -n 1)
            fi
          fi
          if [ -n "$f" ]; then cp "$f" game.nes; fi
          ls -la

      - name: Sincronizar web con Android
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: nes-player-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
